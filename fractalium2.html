<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fractalarium - Edición Cristal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@200;400;700&family=Space+Mono:wght@400;700&display=swap');

        :root {
            --neon-primary: #00f3ff;
            --neon-secondary: #bd00ff;
            --bg-deep: #030014;
        }

        body {
            background-color: var(--bg-deep);
            color: #e2e8f0;
            font-family: 'Outfit', sans-serif;
            overflow: hidden;
            /* Prevenir rebote en iOS */
            overscroll-behavior: none;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(0, 243, 255, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(189, 0, 255, 0.08) 0%, transparent 40%);
        }

        /* Paneles de Vidrio */
        .glass-panel {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
        }

        .fractal-card {
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            cursor: pointer;
            /* Fix para parpadeo en móviles */
            -webkit-transform: translateZ(0);
        }
        .fractal-card:hover {
            transform: translateY(-8px) scale(1.02);
            border-color: var(--neon-primary);
            box-shadow: 0 0 25px -5px var(--neon-primary);
        }

        canvas {
            /* Crucial para móviles: evita que el navegador haga scroll al arrastrar el fractal */
            touch-action: none; 
        }

        /* Animación del Logo */
        .logo-stroke {
            stroke-dasharray: 400;
            stroke-dashoffset: 400;
            animation: drawLogo 2.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }
        @keyframes drawLogo { to { stroke-dashoffset: 0; } }

        /* Controles UI Estilizados */
        input[type=color] {
            -webkit-appearance: none; border: none; width: 32px; height: 32px;
            border-radius: 50%; cursor: pointer; padding: 0; background: none;
            border: 2px solid rgba(255,255,255,0.2);
        }
        input[type=color]::-webkit-color-swatch { border: none; border-radius: 50%; }

        input[type=range] { -webkit-appearance: none; background: transparent; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; height: 14px; width: 14px;
            border-radius: 50%; background: var(--neon-primary); 
            margin-top: -5px; cursor: pointer; box-shadow: 0 0 10px var(--neon-primary);
        }
        input[type=range]::-webkit-slider-runnable-track { 
            width: 100%; height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; 
        }

        .font-mono { font-family: 'Space Mono', monospace; }
        
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }
    </style>
</head>
<body class="h-screen flex flex-col">

    <!-- Definición de Gradientes SVG -->
    <svg width="0" height="0" class="absolute">
        <defs>
            <linearGradient id="gradLogo" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" style="stop-color:#00f3ff" />
                <stop offset="100%" style="stop-color:#bd00ff" />
            </linearGradient>
        </defs>
    </svg>

    <!-- Modal de Bienvenida -->
    <div id="welcomeModal" class="fixed inset-0 z-[100] flex items-center justify-center bg-[#030014] transition-all duration-700">
        <div class="relative z-10 text-center p-8 max-w-xl w-full">
            <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[400px] h-[400px] bg-cyan-500/10 rounded-full blur-[80px] pointer-events-none"></div>
            
            <div class="mb-10 flex justify-center">
                <svg width="160" height="160" viewBox="0 0 100 100" fill="none">
                    <path class="logo-stroke" d="M50 5 L90 27.5 L90 72.5 L50 95 L10 72.5 L10 27.5 Z" stroke="url(#gradLogo)" stroke-width="2" />
                    <path class="logo-stroke" d="M50 20 L75 35 L75 65 L50 80 L25 65 L25 35 Z" stroke="url(#gradLogo)" stroke-width="2" style="animation-delay: 0.2s"/>
                    <path class="logo-stroke" d="M50 35 L60 42.5 L60 57.5 L50 65 L40 57.5 L40 42.5 Z" stroke="url(#gradLogo)" stroke-width="2" style="animation-delay: 0.4s"/>
                </svg>
            </div>
            
            <h1 class="text-4xl md:text-6xl font-extralight mb-4 text-white tracking-tighter">
                Fractalarium
            </h1>
            <p class="text-cyan-400/60 mb-12 text-sm font-mono tracking-[0.4em] uppercase">
                Estudio Geométrico
            </p>
            
            <button id="enterBtn" class="px-10 py-4 border border-cyan-500/30 rounded-full hover:bg-cyan-500/10 text-cyan-400 font-bold tracking-widest uppercase text-xs transition-all hover:scale-105 active:scale-95 shadow-[0_0_20px_rgba(0,243,255,0.1)]">
                Inicializar Sistema
            </button>
        </div>
    </div>

    <!-- Header Flotante -->
    <header class="fixed top-0 left-0 right-0 p-4 md:p-6 z-20 pointer-events-none">
        <div class="max-w-7xl mx-auto flex justify-between items-center pointer-events-auto">
            <div class="flex items-center gap-4 glass-panel px-5 py-2.5 rounded-full">
                <svg width="20" height="20" viewBox="0 0 100 100" fill="none">
                    <path d="M50 5 L90 27.5 L90 72.5 L50 95 L10 72.5 L10 27.5 Z" stroke="url(#gradLogo)" stroke-width="8" />
                </svg>
                <span class="text-sm font-bold tracking-widest uppercase text-slate-200">Fractalarium</span>
            </div>
            
            <button id="backBtn" class="hidden glass-panel px-5 py-2.5 rounded-full text-[10px] font-bold tracking-widest uppercase hover:bg-white/10 transition flex items-center gap-2 group cursor-pointer z-50 text-cyan-400">
                <span class="group-hover:-translate-x-1 transition-transform">←</span> Volver
            </button>
        </div>
    </header>

    <!-- Contenido -->
    <main class="flex-1 overflow-hidden relative pt-24 pb-6 px-4 md:px-6">
        
        <!-- Galería (Grid) -->
        <div id="menuContainer" class="h-full overflow-y-auto custom-scrollbar">
            <div id="menuGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 max-w-7xl mx-auto pb-10">
                <!-- Cards JS -->
            </div>
        </div>

        <!-- Vista Detalle (Layout Cristal) -->
        <div id="detailView" class="hidden absolute inset-0 pt-24 pb-6 px-4 md:px-6 z-10 flex items-center justify-center">
            <div class="max-w-7xl w-full h-full flex flex-col lg:flex-row gap-6">
                
                <!-- Canvas Container -->
                <div class="flex-1 relative glass-panel rounded-3xl overflow-hidden flex flex-col p-1 group">
                    <canvas id="fractalCanvas" class="w-full h-full object-contain cursor-crosshair rounded-2xl bg-[#020510]"></canvas>
                    
                    <!-- Overlay Info -->
                    <div class="absolute top-6 left-6 pointer-events-none">
                        <div class="glass-panel px-3 py-1.5 rounded-lg inline-flex items-center gap-3">
                            <span class="w-1.5 h-1.5 rounded-full bg-cyan-400 animate-pulse"></span>
                            <span class="font-mono text-[10px] text-cyan-200">NIVEL: <span id="iterDisplay">0</span>/<span id="maxIterDisplay">0</span></span>
                        </div>
                    </div>
                    
                    <div id="zoomHint" class="hidden absolute bottom-6 right-6 pointer-events-none opacity-0 group-hover:opacity-100 transition-opacity duration-500">
                        <div class="glass-panel px-3 py-1.5 rounded-lg">
                            <span class="font-mono text-[9px] text-slate-400">SCROLL ZOOM • ARRASTRAR</span>
                        </div>
                    </div>
                </div>

                <!-- Controles -->
                <div class="w-full lg:w-80 flex flex-col gap-4 h-auto lg:h-full lg:overflow-y-auto custom-scrollbar shrink-0">
                    
                    <!-- Info Card -->
                    <div class="glass-panel p-6 rounded-3xl">
                        <h2 id="fractalTitle" class="text-2xl font-light mb-2 text-white tracking-tight">Nombre</h2>
                        <div class="h-0.5 w-8 bg-cyan-500 mb-3"></div>
                        <p id="fractalDesc" class="text-xs text-slate-400 font-light leading-relaxed"></p>
                    </div>

                    <!-- Panel de Mando -->
                    <div class="glass-panel p-5 rounded-3xl flex flex-col gap-5">
                        
                        <div class="flex items-center justify-between">
                            <span class="text-[10px] font-bold tracking-widest text-slate-500 uppercase">Color</span>
                            <div class="flex items-center gap-2">
                                <span id="colorHex" class="font-mono text-[9px] text-slate-400">#00F3FF</span>
                                <input type="color" id="colorPicker" value="#00f3ff">
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-2">
                            <button id="animBtn" class="py-3 rounded-xl bg-white/5 hover:bg-white/10 border border-white/5 transition flex flex-col items-center justify-center gap-1 group">
                                <span id="animIcon" class="text-lg group-hover:scale-125 transition-transform text-cyan-400">▶</span>
                                <span id="animText" class="text-[9px] font-bold tracking-widest uppercase text-slate-300">Evolucionar</span>
                            </button>
                            <button id="downloadBtn" class="py-3 rounded-xl bg-white/5 hover:bg-white/10 border border-white/5 transition flex flex-col items-center justify-center gap-1 group">
                                <span class="text-lg group-hover:translate-y-1 transition-transform text-purple-400">⇩</span>
                                <span class="text-[9px] font-bold tracking-widest uppercase text-slate-300">Guardar</span>
                            </button>
                        </div>

                        <div id="speedControl" class="hidden">
                            <div class="flex justify-between mb-1">
                                <span class="text-[9px] font-bold tracking-widest text-slate-500 uppercase">Velocidad</span>
                            </div>
                            <input type="range" id="animSpeed" min="50" max="1000" step="50" value="500" class="w-full">
                        </div>

                        <!-- Controles Mandelbrot -->
                        <div id="mandelControls" class="hidden flex-col gap-3 pt-3 border-t border-white/10">
                            <div class="flex justify-between items-center">
                                <span class="text-[9px] font-bold tracking-widest text-slate-500 uppercase">Iteraciones</span>
                                <input type="number" id="maxIterInput" value="500" class="w-12 bg-black/20 border border-white/10 rounded px-1 py-1 text-right text-[10px] font-mono text-cyan-400 outline-none focus:border-cyan-400">
                            </div>
                            <div class="grid grid-cols-4 gap-1">
                                <button data-val="1" class="step-btn py-1 rounded text-[9px] font-mono border border-cyan-500/50 text-cyan-400 bg-cyan-500/10">1x</button>
                                <button data-val="2" class="step-btn py-1 rounded text-[9px] font-mono border border-white/5 text-slate-500 hover:bg-white/5">2x</button>
                                <button data-val="10" class="step-btn py-1 rounded text-[9px] font-mono border border-white/5 text-slate-500 hover:bg-white/5">10x</button>
                                <button data-val="50" class="step-btn py-1 rounded text-[9px] font-mono border border-white/5 text-slate-500 hover:bg-white/5">50x</button>
                            </div>
                            <button id="resetViewBtn" class="w-full py-1.5 rounded border border-white/10 text-[9px] text-slate-400 hover:text-white uppercase tracking-widest hover:bg-white/5 transition">
                                Recentrar
                            </button>
                        </div>
                    </div>

                    <!-- Navegación Paso a Paso -->
                    <div class="glass-panel p-4 rounded-3xl flex items-center justify-between mt-auto gap-2">
                        <button id="prevBtn" class="flex-1 py-3 rounded-xl bg-white/5 hover:bg-white/10 transition text-cyan-400 font-bold text-[10px] tracking-widest uppercase border border-white/5 hover:border-cyan-500/30">
                            <span class="mr-1">←</span> Prev
                        </button>
                        
                        <button id="resetBtn" class="px-4 py-3 rounded-xl hover:bg-red-500/10 transition text-slate-500 hover:text-red-400 font-bold text-[10px] tracking-widest uppercase" title="Reiniciar">
                            ↺
                        </button>
                        
                        <button id="nextBtn" class="flex-1 py-3 rounded-xl bg-cyan-500/10 hover:bg-cyan-500/20 transition text-cyan-300 font-bold text-[10px] tracking-widest uppercase border border-cyan-500/20 hover:border-cyan-500/50 shadow-[0_0_15px_rgba(0,243,255,0.1)]">
                            Sig <span class="ml-1">→</span>
                        </button>
                    </div>

                    <!-- Nota -->
                    <div class="glass-panel p-5 rounded-3xl border-l-2 border-l-purple-500 hidden md:block">
                        <h4 class="text-[9px] font-black text-purple-400 uppercase tracking-widest mb-1">Info</h4>
                        <p id="fractalFact" class="text-[10px] text-slate-300 font-light leading-relaxed italic"></p>
                    </div>

                </div>
            </div>
        </div>
    </main>

    <script>
        // ==========================================
        // LÓGICA DE FRACTALIUM
        // ==========================================

        const fractals = [
            { id: 'snowflake', name: 'Copo de Koch', thumbIter: 4, maxIter: 6, step: 1, desc: 'Perímetro infinito en área finita.', fact: 'Cada iteración aumenta la longitud total en un factor de 4/3.' },
            { id: 'mandelbrot', name: 'Mandelbrot', thumbIter: 20, maxIter: 800, startIter: 1, step: 1, desc: 'El mapa del caos organizado.', fact: 'La frontera es infinitamente compleja.' },
            { id: 'sierpinski', name: 'Triángulo Sierpinski', thumbIter: 6, maxIter: 9, step: 1, desc: 'Recursividad triangular pura.', fact: 'Su dimensión fractal es aprox 1.585.' },
            { id: 'pytree', name: 'Árbol de Pitágoras', thumbIter: 7, maxIter: 12, startIter: 1, step: 1, desc: 'Cuadrados que se ramifican respetando el teorema.', fact: 'La suma de áreas de ramas siempre iguala el área del tronco.' },
            { id: 'tree', name: 'Árbol Fractal', thumbIter: 9, maxIter: 13, step: 1, desc: 'Ramificación binaria natural.', fact: 'Imita pulmones y redes fluviales.' },
            { id: 'hilbert', name: 'Curva de Hilbert', thumbIter: 5, maxIter: 8, step: 1, desc: 'Línea 1D que llena el plano 2D.', fact: 'Recorre cada punto sin cruzarse.' },
            { id: 'pentaflake', name: 'Pentaflake', thumbIter: 3, maxIter: 5, step: 1, desc: 'Pentágono central rodeado de 5 copias menores.', fact: 'Basado en la proporción áurea φ = 1.618.' },
            { id: 'ring', name: 'Anillo Fractal', thumbIter: 3, maxIter: 5, step: 1, desc: 'Anillo que genera 6 anillos menores en su perímetro.', fact: 'La autosimilitud radial revela simetría de orden 6.' },
            { id: 'carpet', name: 'Alfombra Sierpinski', thumbIter: 4, maxIter: 6, startIter: 0, step: 1, desc: 'Cuadrados dentro de cuadrados.', fact: 'Base de las antenas fractales.' },
            { id: 'tsquare', name: 'T-Square', thumbIter: 5, maxIter: 8, step: 1, desc: 'Expansión desde los vértices.', fact: 'Perímetro infinito, área finita.' },
            { id: 'vicsek', name: 'Cruz de Vicsek', thumbIter: 4, maxIter: 6, step: 1, desc: 'Estructura en cruz recursiva.', fact: 'Usado en ingeniería de estructuras.' },
            
            { id: 'cantor', name: 'Polvo de Cantor', thumbIter: 5, maxIter: 8, step: 1, desc: 'Eliminación del tercio central.', fact: 'Muchos puntos, longitud cero.' }
        ];

        let currentColor = { hex: '#00f3ff', r: 0, g: 243, b: 255 };
        let currentFractalId = null;
        let iteration = 0;
        let mainCanvas, mainCtx, mainWidth, mainHeight;
        let stepMultiplier = 1;
        let animInterval = null;
        let isAnimating = false;
        
        let mandelView = { x: -0.5, y: 0, zoom: 3.5 };
        let isDragging = false;
        let dragStart = { x: 0, y: 0 };
        let viewStart = { x: 0, y: 0 };

        function init() {
            mainCanvas = document.getElementById('fractalCanvas');
            mainCtx = mainCanvas.getContext('2d');

            mainCtx.shadowBlur = 10;
            mainCtx.shadowColor = currentColor.hex;

            renderMenu();

            const modal = document.getElementById('welcomeModal');
            document.getElementById('enterBtn').onclick = () => {
                modal.style.opacity = '0';
                setTimeout(() => modal.classList.add('hidden'), 500);
            };

            document.getElementById('backBtn').onclick = closeFractal;
            document.getElementById('nextBtn').onclick = nextStep;
            document.getElementById('prevBtn').onclick = prevStep;
            document.getElementById('resetBtn').onclick = resetFractal;
            document.getElementById('resetViewBtn').onclick = resetMandelbrotView;
            document.getElementById('animBtn').onclick = toggleAnimation;
            document.getElementById('downloadBtn').onclick = downloadImage;
            document.getElementById('colorPicker').addEventListener('input', handleColorChange);
            
            document.getElementById('maxIterInput').onchange = (e) => {
                let val = parseInt(e.target.value);
                if(isNaN(val)) val = 500;
                val = Math.max(50, Math.min(2000, val));
                e.target.value = val;
                const f = fractals.find(x => x.id === 'mandelbrot');
                if(f) { f.maxIter = val; if(currentFractalId === 'mandelbrot') drawMain(); }
            };

            document.querySelectorAll('.step-btn').forEach(btn => btn.onclick = (e) => setMultiplier(e.target));

            // --- LISTENERS MEJORADOS PARA MÓVIL ---
            window.addEventListener('resize', handleResize);
            
            // Mouse Events
            mainCanvas.addEventListener('mousedown', startDrag);
            window.addEventListener('mousemove', drag);
            window.addEventListener('mouseup', endDrag);
            mainCanvas.addEventListener('wheel', handleZoom, { passive: false });

            // Touch Events (NUEVO)
            mainCanvas.addEventListener('touchstart', handleTouchStart, { passive: false });
            mainCanvas.addEventListener('touchmove', handleTouchMove, { passive: false });
            mainCanvas.addEventListener('touchend', endDrag);
        }

        // --- GESTIÓN DE EVENTOS TÁCTILES ---
        function handleTouchStart(e) {
            if (e.touches.length === 1) {
                // Prevenir scroll solo si estamos arrastrando
                if(currentFractalId === 'mandelbrot') e.preventDefault(); 
                const touch = e.touches[0];
                // Simular mousedown
                startDrag({ clientX: touch.clientX, clientY: touch.clientY });
            }
        }

        function handleTouchMove(e) {
            if (e.touches.length === 1) {
                if(currentFractalId === 'mandelbrot') e.preventDefault();
                const touch = e.touches[0];
                drag({ clientX: touch.clientX, clientY: touch.clientY });
            }
        }

        // --- SISTEMA DE RENDERIZADO ROBUSTO PARA MÓVIL ---
        function renderMenu() {
            const grid = document.getElementById('menuGrid');
            grid.innerHTML = '';
            fractals.forEach(f => {
                const card = document.createElement('div');
                card.className = 'fractal-card glass-panel rounded-2xl relative overflow-hidden h-64 group';
                card.innerHTML = `
                    <div class="absolute inset-0">
                        <canvas id="thumb-${f.id}" class="w-full h-full object-cover opacity-60 group-hover:opacity-100 transition duration-700"></canvas>
                    </div>
                    <div class="absolute inset-0 bg-gradient-to-t from-[#030014] via-transparent to-transparent flex flex-col justify-end p-6">
                        <h3 class="text-lg font-light text-white mb-1 tracking-tight uppercase">${f.name}</h3>
                        <div class="w-6 h-0.5 bg-cyan-400 group-hover:w-full transition-all duration-500"></div>
                    </div>
                `;
                card.onclick = () => openFractal(f);
                grid.appendChild(card);
                
                // Sistema de espera activa: Reintenta dibujar hasta que el elemento tenga tamaño
                waitForLayoutAndDraw(f.id, f.thumbIter);
            });
        }

        function waitForLayoutAndDraw(id, iter) {
            const c = document.getElementById(`thumb-${id}`);
            if (!c) return;

            // Si tiene tamaño, dibujar
            if (c.parentElement.clientWidth > 0 && c.parentElement.clientHeight > 0) {
                c.width = c.parentElement.clientWidth;
                c.height = c.parentElement.clientHeight;
                drawSpecific(id, c.getContext('2d'), c.width, c.height, iter, false);
            } else {
                // Si no tiene tamaño (móvil cargando), reintentar en el siguiente frame
                requestAnimationFrame(() => waitForLayoutAndDraw(id, iter));
            }
        }

        function handleColorChange(e) {
            const hex = e.target.value;
            const r = parseInt(hex.slice(1,3), 16), g = parseInt(hex.slice(3,5), 16), b = parseInt(hex.slice(5,7), 16);
            currentColor = { hex, r, g, b };
            document.getElementById('colorHex').textContent = hex.toUpperCase();
            mainCtx.shadowColor = hex;
            document.documentElement.style.setProperty('--neon-primary', hex);
            if (currentFractalId) drawMain();
        }

        function stopAnimation() {
            if (isAnimating) {
                isAnimating = false;
                clearInterval(animInterval);
                document.getElementById('animText').textContent = 'Evolucionar';
                document.getElementById('animIcon').textContent = '▶';
                document.getElementById('speedControl').classList.add('hidden');
            }
        }

        function openFractal(f) {
            currentFractalId = f.id;
            iteration = f.startIter || 0;
            mandelView = { x: -0.5, y: 0, zoom: 3.5 };
            stopAnimation();

            document.getElementById('colorPicker').value = currentColor.hex;
            document.getElementById('colorHex').textContent = currentColor.hex.toUpperCase();

            document.getElementById('menuContainer').classList.add('hidden');
            document.getElementById('detailView').classList.remove('hidden');
            document.getElementById('backBtn').classList.remove('hidden');
            
            document.getElementById('fractalTitle').textContent = f.name;
            document.getElementById('fractalDesc').textContent = f.desc;
            document.getElementById('fractalFact').textContent = f.fact;

            const mControls = document.getElementById('mandelControls');
            const zHint = document.getElementById('zoomHint');
            
            if (f.id === 'mandelbrot') {
                mControls.classList.remove('hidden'); mControls.classList.add('flex');
                zHint.classList.remove('hidden');
                document.getElementById('maxIterInput').value = f.maxIter;
                mainCtx.shadowBlur = 0; 
            } else {
                mControls.classList.remove('flex'); mControls.classList.add('hidden');
                zHint.classList.add('hidden');
                mainCtx.shadowBlur = 10;
                mainCtx.shadowColor = currentColor.hex;
            }
            
            // Forzar resize inmediato para móviles
            setTimeout(handleResize, 50);
        }

        function closeFractal() {
            stopAnimation();
            document.getElementById('menuContainer').classList.remove('hidden');
            document.getElementById('detailView').classList.add('hidden');
            document.getElementById('backBtn').classList.add('hidden');
            currentFractalId = null;
            renderMenu();
        }

        function handleResize() {
            if (!currentFractalId) return;
            const container = mainCanvas.parentElement;
            if (container.clientWidth > 0 && container.clientHeight > 0) {
                mainCanvas.width = container.clientWidth;
                mainCanvas.height = container.clientHeight;
                mainWidth = mainCanvas.width;
                mainHeight = mainCanvas.height;
                if(currentFractalId !== 'mandelbrot') {
                    mainCtx.shadowBlur = 10;
                    mainCtx.shadowColor = currentColor.hex;
                }
                drawMain();
            }
        }

        function toggleAnimation() {
            if (isAnimating) {
                stopAnimation();
            } else {
                isAnimating = true;
                document.getElementById('animText').textContent = 'Pausar';
                document.getElementById('animIcon').textContent = '⏸';
                document.getElementById('speedControl').classList.remove('hidden');
                
                const f = fractals.find(x => x.id === currentFractalId);
                animInterval = setInterval(() => {
                    const s = (f.id === 'mandelbrot') ? (f.step * stepMultiplier) : f.step;
                    if (iteration < f.maxIter) { 
                        iteration += s; 
                        iteration = Math.min(iteration, f.maxIter); 
                        drawMain(); 
                    } else { 
                        setTimeout(() => { if (isAnimating) { iteration = f.startIter || 0; drawMain(); } }, 1000); 
                    }
                }, 1050 - document.getElementById('animSpeed').value);
            }
        }

        function nextStep() {
            const f = fractals.find(x => x.id === currentFractalId);
            const s = (f.id === 'mandelbrot') ? (f.step * stepMultiplier) : f.step;
            if (iteration < f.maxIter) { iteration += s; iteration = Math.min(iteration, f.maxIter); drawMain(); }
        }
        function prevStep() {
            const f = fractals.find(x => x.id === currentFractalId);
            const s = (f.id === 'mandelbrot') ? (f.step * stepMultiplier) : f.step;
            const min = f.startIter || 0;
            if (iteration > min) { iteration -= s; iteration = Math.max(iteration, min); drawMain(); }
        }
        function resetFractal() { iteration = fractals.find(x => x.id === currentFractalId).startIter || 0; drawMain(); }
        function resetMandelbrotView() { mandelView = { x: -0.5, y: 0, zoom: 3.5 }; drawMain(); }
        
        function setMultiplier(btn) {
            stepMultiplier = parseInt(btn.dataset.val);
            document.querySelectorAll('.step-btn').forEach(b => {
                if(parseInt(b.dataset.val) === stepMultiplier) {
                    b.classList.remove('border-white/5', 'text-slate-500', 'hover:bg-white/5');
                    b.classList.add('border-cyan-500/50', 'text-cyan-400', 'bg-cyan-500/10');
                } else {
                    b.classList.add('border-white/5', 'text-slate-500', 'hover:bg-white/5');
                    b.classList.remove('border-cyan-500/50', 'text-cyan-400', 'bg-cyan-500/10');
                }
            });
        }
        function downloadImage() {
            const a = document.createElement('a');
            a.download = `fractal_${currentFractalId}.png`;
            a.href = mainCanvas.toDataURL();
            a.click();
        }

        function startDrag(e) { 
            if (currentFractalId === 'mandelbrot') { 
                isDragging = true; 
                dragStart = { x: e.clientX, y: e.clientY }; 
                viewStart = { ...mandelView }; 
            } 
        }
        function drag(e) {
            if (!isDragging || currentFractalId !== 'mandelbrot') return;
            const dx = e.clientX - dragStart.x;
            const dy = e.clientY - dragStart.y;
            const scale = mandelView.zoom / mainWidth;
            mandelView.x = viewStart.x - dx * scale;
            mandelView.y = viewStart.y - dy * scale;
            requestAnimationFrame(drawMain);
        }
        function endDrag() { isDragging = false; if(currentFractalId === 'mandelbrot') drawMain(); }
        
        function handleZoom(e) {
            if (currentFractalId !== 'mandelbrot') return;
            e.preventDefault();
            const rect = mainCanvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;
            
            const s = mandelView.zoom / mainWidth;
            const mouseRe = mandelView.x - (mandelView.zoom / 2) + mouseX * s;
            const mouseIm = mandelView.y - (mandelView.zoom * (mainHeight/mainWidth) / 2) + mouseY * s;
            
            const factor = e.deltaY > 0 ? 1.1 : 0.9;
            mandelView.zoom *= factor;
            
            const newS = mandelView.zoom / mainWidth;
            mandelView.x = mouseRe - (mouseX * newS) + (mandelView.zoom / 2);
            mandelView.y = mouseIm - (mouseY * newS) + (mandelView.zoom * (mainHeight/mainWidth) / 2);
            
            drawMain();
        }

        function drawMain() {
            const f = fractals.find(x => x.id === currentFractalId);
            if(!f) return;
            document.getElementById('iterDisplay').textContent = Math.floor(iteration);
            document.getElementById('maxIterDisplay').textContent = f.maxIter;
            drawSpecific(currentFractalId, mainCtx, mainWidth, mainHeight, iteration, true);
        }

        function drawSpecific(id, ctx, w, h, iter, isMain) {
            if (!w || !h) return;
            ctx.clearRect(0, 0, w, h);
            
            ctx.strokeStyle = currentColor.hex;
            ctx.fillStyle = currentColor.hex;
            ctx.lineWidth = isMain ? 1.5 : 2;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            
            if (!isMain) ctx.shadowBlur = 0; 

            switch (id) {
                case 'snowflake': drawSnowflake(ctx, w, h, iter); break;
                case 'mandelbrot': drawMandelbrot(ctx, w, h, iter, isMain); break;
                case 'sierpinski': drawSierpinski(ctx, w, h, iter); break;
                case 'pytree': drawPytree(ctx, w, h, iter); break;
                case 'tree': drawTree(ctx, w, h, iter); break;
                case 'hilbert': drawHilbert(ctx, w, h, iter); break;
                case 'pentaflake': drawPentaflake(ctx, w, h, iter); break;
                case 'ring': drawRing(ctx, w, h, iter); break;
                case 'carpet': drawCarpet(ctx, w, h, iter); break;
                case 'tsquare': drawTSquare(ctx, w, h, iter); break;
                case 'vicsek': drawVicsek(ctx, w, h, iter); break;
                                case 'cantor': drawCantor(ctx, w, h, iter); break;
            }
        }

        function drawSnowflake(ctx, w, h, iter) {
            const side = Math.min(w, h) * 0.7, hT = side * 0.866, cx = w/2, cy = h/2;
            const p1 = { x: cx - side/2, y: cy + hT/3 }, p2 = { x: cx + side/2, y: cy + hT/3 }, p3 = { x: cx, y: cy - hT*2/3 };
            const kl = (a, b, d) => {
                if (d === 0) { ctx.lineTo(b.x, b.y); } 
                else { const dx = b.x-a.x, dy = b.y-a.y, p1 = {x:a.x+dx/3, y:a.y+dy/3}, p3 = {x:a.x+2*dx/3, y:a.y+2*dy/3}, p2 = {x:p1.x+(p3.x-p1.x)*0.5-(p3.y-p1.y)*0.866, y:p1.y+(p3.x-p1.x)*0.866+(p3.y-p1.y)*0.5}; kl(a, p1, d-1); kl(p1, p2, d-1); kl(p2, p3, d-1); kl(p3, b, d-1); }
            };
            ctx.beginPath(); ctx.moveTo(p1.x, p1.y); kl(p1, p2, iter); kl(p2, p3, iter); kl(p3, p1, iter); ctx.closePath(); ctx.stroke();
            if(iter > 1) { ctx.save(); ctx.shadowBlur = 0; ctx.fillStyle = `rgba(${currentColor.r}, ${currentColor.g}, ${currentColor.b}, 0.1)`; ctx.fill(); ctx.restore(); }
        }

        function drawMandelbrot(ctx, w, h, maxN, isMain) {
            const q = isMain ? (isDragging ? 4 : (w < 500 ? 2 : 1)) : 4;
            const cw = Math.floor(w/q), ch = Math.floor(h/q);
            if(cw <= 0 || ch <= 0) return;
            const img = ctx.createImageData(cw, ch), data = img.data;
            const aspect = h/w;
            const v = isMain ? mandelView : {x: -0.5, y: 0, zoom: 3.5};
            const minR = v.x-v.zoom/2, maxR = v.x+v.zoom/2, minI = v.y-v.zoom*aspect/2, maxI = v.y+v.zoom*aspect/2;
            for(let y=0; y<ch; y++) {
                const ci = maxI - y*(maxI-minI)/(ch-1);
                for(let x=0; x<cw; x++) {
                    const cr = minR + x*(maxR-minR)/(cw-1);
                    let zr = cr, zi = ci, n = 0;
                    const q2 = (cr-0.25)*(cr-0.25) + ci*ci;
                    if(q2*(q2+(cr-0.25)) < 0.25*ci*ci) n = maxN;
                    else { while(n < maxN && (zr*zr + zi*zi) < 4) { const t = zr*zr - zi*zi + cr; zi = 2*zr*zi + ci; zr = t; n++; } }
                    const i = (y*cw + x)*4;
                    if (n === maxN) { data[i]=0; data[i+1]=0; data[i+2]=0; data[i+3]=255; } 
                    else { const wave = Math.sqrt(n / maxN); data[i] = currentColor.r * wave; data[i+1] = currentColor.g * wave; data[i+2] = currentColor.b * wave; data[i+3] = 255; }
                }
            }
            const tc = document.createElement('canvas'); tc.width=cw; tc.height=ch; 
            tc.getContext('2d').putImageData(img, 0, 0);
            ctx.imageSmoothingEnabled = q === 1; ctx.drawImage(tc, 0, 0, w, h);
        }

        function drawSierpinski(ctx, w, h, iter) {
            const tr = (a, b, c, d) => { if (d === 0) { ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.lineTo(c.x, c.y); ctx.closePath(); ctx.stroke(); } else { const ab = {x:(a.x+b.x)/2, y:(a.y+b.y)/2}, bc = {x:(b.x+c.x)/2, y:(b.y+c.y)/2}, ca = {x:(c.x+a.x)/2, y:(c.y+a.y)/2}; tr(a, ab, ca, d-1); tr(ab, b, bc, d-1); tr(ca, bc, c, d-1); } };
            tr({x:w/2, y:h*0.1}, {x:w*0.05, y:h*0.9}, {x:w*0.95, y:h*0.9}, iter);
        }
        function drawPytree(ctx, w, h, iter) {
            const baseW = Math.min(w, h) * 0.14;
            const bx = w/2 - baseW/2;
            const by = h * 0.89;

            const branch = (x, y, s, angle, depth) => {
                if (depth === 0 || s < 0.5) return;
                const cosA = Math.cos(angle), sinA = Math.sin(angle);
                ctx.save();
                ctx.translate(x, y);
                ctx.rotate(angle);
                ctx.beginPath();
                ctx.rect(0, -s, s, s);
                ctx.stroke();
                ctx.restore();
                const tlx = x + s * sinA,        tly = y - s * cosA;
                const trx = x + s*(cosA + sinA),  try_ = y + s*(sinA - cosA);
                const apexX = (tlx+trx)/2 + sinA*s/2;
                const apexY = (tly+try_)/2 - cosA*s/2;
                const s2 = s * Math.SQRT1_2;
                branch(tlx,   tly,  s2, angle - Math.PI/4, depth - 1);
                branch(apexX, apexY, s2, angle + Math.PI/4, depth - 1);
            };

            ctx.lineWidth = 1;
            branch(bx, by, baseW, 0, iter);
            ctx.lineWidth = 1.5;
        }
        function drawTree(ctx, w, h, iter) {
            const br = (x, y, l, th, d) => { if (d === 0) return; const ex = x+l*Math.sin(th), ey = y-l*Math.cos(th); ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(ex, ey); ctx.lineWidth = d*0.4; ctx.stroke(); br(ex, ey, l*0.75, th+0.5, d-1); br(ex, ey, l*0.75, th-0.5, d-1); };
            br(w/2, h*0.95, h*0.25, 0, iter);
        }
        function drawHilbert(ctx, w, h, iter) {
            const sz = Math.min(w,h)*0.8; let p = null;
            const hb = (x, y, xi, xj, yi, yj, n) => { if (n <= 0) { const cx = x+(xi+yi)/2, cy = y+(xj+yj)/2; if(!p) ctx.moveTo(cx, cy); else ctx.lineTo(cx, cy); p={x:cx,y:cy}; } else { hb(x, y, yi/2, yj/2, xi/2, xj/2, n-1); hb(x+xi/2, y+xj/2, xi/2, xj/2, yi/2, yj/2, n-1); hb(x+xi/2+yi/2, y+xj/2+yj/2, xi/2, xj/2, yi/2, yj/2, n-1); hb(x+xi/2+yi, y+xj/2+yj, -yi/2, -yj/2, -xi/2, -xj/2, n-1); } };
            ctx.beginPath(); hb((w-sz)/2, (h-sz)/2, sz, 0, 0, sz, iter); ctx.stroke();
        }
        function drawPentaflake(ctx, w, h, iter) {
            const cx = w/2, cy = h/2, R = Math.min(w,h)*0.43;
            function pent(x, y, r) {
                ctx.beginPath();
                for (let i=0; i<5; i++) {
                    const a = i*2*Math.PI/5 - Math.PI/2;
                    i===0 ? ctx.moveTo(x+r*Math.cos(a), y+r*Math.sin(a))
                          : ctx.lineTo(x+r*Math.cos(a), y+r*Math.sin(a));
                }
                ctx.closePath(); ctx.stroke();
            }
            function pf(x, y, r, d) {
                if (d===0) { pent(x, y, r); return; }
                const c = r/3, dist = r*2/3;
                pf(x, y, c, d-1);
                for (let i=0; i<5; i++) {
                    const a = i*2*Math.PI/5 - Math.PI/2;
                    pf(x+dist*Math.cos(a), y+dist*Math.sin(a), c, d-1);
                }
            }
            pf(cx, cy, R, iter);
        }
        function drawRing(ctx, w, h, iter) {
            const cx = w/2, cy = h/2, R = Math.min(w,h)*0.41;
            function ring(x, y, r, d) {
                ctx.beginPath(); ctx.arc(x, y, r, 0, 2*Math.PI); ctx.stroke();
                ctx.beginPath(); ctx.arc(x, y, r*0.45, 0, 2*Math.PI); ctx.stroke();
                if (d===0) return;
                const cr = r*0.28, dist = r*0.72;
                for (let i=0; i<6; i++) {
                    const a = i*Math.PI/3;
                    ring(x+dist*Math.cos(a), y+dist*Math.sin(a), cr, d-1);
                }
            }
            ring(cx, cy, R, iter);
        }
        function drawCarpet(ctx, w, h, iter) {
            const s = Math.min(w,h)*0.85; const dr = (x, y, z, d) => { if(d===0) { ctx.fillRect(x, y, z, z); return; } const ns=z/3; for(let r=0; r<3; r++) for(let c=0; c<3; c++) if(r!==1 || c!==1) dr(x+c*ns, y+r*ns, ns, d-1); };
            dr((w-s)/2, (h-s)/2, s, iter);
        }
        function drawTSquare(ctx, w, h, iter) {
            const s = Math.min(w,h)*0.45; ctx.fillRect(w/2-s/2, h/2-s/2, s, s); const dc = (x, y, z, d) => { if(d===0) return; const ns=z/2; [-1, 1].forEach(ox => [-1, 1].forEach(oy => { const nx=x+ox*z/2, ny=y+oy*z/2; ctx.fillRect(nx-ns/2, ny-ns/2, ns, ns); dc(nx, ny, ns, d-1); })); };
            dc(w/2, h/2, s, iter);
        }
        function drawVicsek(ctx, w, h, iter) {
            const s = Math.min(w,h)*0.8; const dv = (x, y, sz, d) => { if(d===0) { ctx.fillRect(x, y, sz, sz); return; } const ns=sz/3; [[0,0],[2,0],[1,1],[0,2],[2,2]].forEach(p => dv(x+p[0]*ns, y+p[1]*ns, ns, d-1)); };
            dv((w-s)/2, (h-s)/2, s, iter);
        }

        function drawCantor(ctx, w, h, iter) {
            const ds = (x, y, l, d) => { if (d > iter) return; ctx.fillRect(x, y, l, 20); ds(x, y+40, l/3, d+1); ds(x+2*l/3, y+40, l/3, d+1); };
            ds(w*0.1, h*0.2, w*0.8, 0);
        }

        init();
    </script>
